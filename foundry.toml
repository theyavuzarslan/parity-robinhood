[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_RPC}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"

[lint]
exclude_lints = ["unsafe-typecast", "mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable"]
